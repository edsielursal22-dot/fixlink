<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixLink Admin - Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --maroon-950: #3a0b18; --maroon-900: #511224; --maroon-700: #7d1f38; --paper: #f6efec; --ink: #291d21; --muted: #75686b; }
        * { box-sizing: border-box; }
        body { display: grid; min-height: 100vh; margin: 0; place-items: center; color: var(--ink); background: #ebe5e2; background-image: linear-gradient(135deg, rgba(104, 23, 45, .08), transparent 45%), linear-gradient(315deg, rgba(125, 31, 56, .06), transparent 48%); font-family: 'DM Sans', sans-serif; }
        .login-shell { display: grid; width: min(880px, calc(100% - 2rem)); min-height: 500px; grid-template-columns: .85fr 1.15fr; overflow: hidden; background: var(--paper); border: 1px solid #dfd1d0; border-radius: 9px; box-shadow: 0 20px 55px rgba(58, 11, 24, .15); }
        .welcome { display: flex; padding: 2.5rem; flex-direction: column; justify-content: space-between; color: #fff; background: var(--maroon-950); }
        .brand { display: flex; align-items: center; gap: .7rem; font-family: 'Libre Baskerville', serif; font-size: 1.1rem; }.mark { display: grid; width: 2.1rem; height: 2.1rem; place-items: center; color: var(--maroon-950); background: #f0c9d1; border-radius: 7px; }
        .welcome h1 { max-width: 260px; margin: 0; font-family: 'Libre Baskerville', serif; font-size: 2.1rem; line-height: 1.25; }.welcome p { max-width: 250px; color: #d9bcc3; line-height: 1.6; }
        .form-area { display: flex; padding: 3rem; flex-direction: column; justify-content: center; }.eyebrow { margin: 0 0 .5rem; color: var(--maroon-700); font-size: .68rem; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }.form-area h2 { margin: 0 0 .6rem; color: var(--maroon-950); font-family: 'Libre Baskerville', serif; font-size: 1.7rem; }.subtitle { margin: 0 0 2rem; color: var(--muted); }
        label { display: block; margin: 1rem 0 .4rem; font-size: .82rem; font-weight: 700; } input { width: 100%; padding: .8rem; color: var(--ink); background: #fbf7f4; border: 1px solid #d8c9c8; border-radius: 4px; font: inherit; } input:focus { outline: 2px solid #d6a4af; border-color: var(--maroon-700); } button { width: 100%; margin-top: 1.5rem; padding: .85rem; color: #fff; background: var(--maroon-700); border: 0; border-radius: 4px; font: inherit; font-weight: 700; cursor: pointer; } button:hover { background: var(--maroon-950); }.error { min-height: 1.2rem; margin-top: 1rem; color: #9a3f3c; font-size: .82rem; }
        @media (max-width: 650px) { .login-shell { grid-template-columns: 1fr; }.welcome { min-height: 220px; padding: 1.7rem; }.welcome h1 { font-size: 1.6rem; }.welcome p { margin-bottom: 0; }.form-area { padding: 2rem 1.7rem; } }
    </style>
</head>
<body>
    <main class="login-shell">
        <section class="welcome"><div class="brand"><span class="mark">F</span><span>FixLink</span></div><div><h1>Keep every repair moving.</h1><p>The private operations workspace for the FixLink platform.</p></div><small>ADMIN ACCESS ONLY</small></section>
        <section class="form-area"><p class="eyebrow">Secure workspace</p><h2>Welcome back</h2><p class="subtitle">Sign in to manage the FixLink marketplace.</p><form id="loginForm"><label for="username">Admin username</label><input id="username" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Sign in to dashboard</button><p class="error" id="error" role="alert"></p></form></section>
    </main>
    <script>
        const form = document.getElementById('loginForm');
        const error = document.getElementById('error');
        form.addEventListener('submit', async event => {
            event.preventDefault(); error.textContent = '';
            try {
                const response = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value }) });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Unable to sign in');
                window.location.href = '/admin/technicians.html';
            } catch (loginError) { error.textContent = loginError.message; }
        });
    </script>
</body>
</html>
