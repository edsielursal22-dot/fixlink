<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixLink Admin - Technician Verification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>FixLink Admin Panel</h2>
            <span class="badge bg-secondary">Technician Approval Module</span>
        </div>
        
        <div class="card shadow-sm">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 text-dark">Pending Technicians</h5>
            </div>
            <div class="card-body">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="techTableBody">
                        <tr><td colspan="4" class="text-center text-muted py-4">Loading pending technicians...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module" src="./firebase-web.js"></script>
    <script>
        async function fetchPendingTechnicians() {
            try {
                const response = await fetch('/api/users/pending-technicians');
                const techs = await response.json();
                
                const tbody = document.getElementById('techTableBody');
                tbody.innerHTML = '';

                if (!Array.isArray(techs) || techs.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-4">No pending technicians found. System is fully up to date.</td></tr>`;
                    return;
                }

                techs.forEach(tech => {
                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${tech.name || 'N/A'}</strong></td>
                            <td>${tech.email || 'N/A'}</td>
                            <td><span class="badge bg-warning text-dark">${tech.status}</span></td>
                            <td>
                                <button class="btn btn-success btn-sm px-3" onclick="approveTechnician('${tech.uid}')">Approve</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error('Error loading technicians:', err);
                document.getElementById('techTableBody').innerHTML = `<tr><td colspan="4" class="text-center text-danger">Failed to load pending technicians from server.</td></tr>`;
            }
        }

        async function approveTechnician(uid) {
            if (!confirm('Are you sure you want to verify and activate this technician account?')) return;

            try {
                const response = await fetch(`/api/admin/verify-technician/${uid}`, {
                    method: 'PATCH'
                });
                
                if (response.ok) {
                    alert('Technician verified successfully!');
                    fetchPendingTechnicians(); // Refresh table
                } else {
                    const errorData = await response.json();
                    alert('Failed to verify: ' + (errorData.error || 'Unknown error'));
                }
            } catch (err) {
                console.error('Error approving technician:', err);
                alert('A network error occurred while attempting approval.');
            }
        }

        fetchPendingTechnicians();
    </script>
</body>
</html>
